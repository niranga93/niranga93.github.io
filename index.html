<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NNRZONE apps</title>
<style>
  :root { --bg: #f6f8f6; --card: #fff; --text: #1c2b1e; --muted: #5b6b5d; --primary: #2E7D32; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1511; --card: #18211a; --text: #e6efe7; --muted: #9fb0a1; --primary: #66bb6a; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  p.lead { margin: 0 0 28px; color: var(--muted); }
  .card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { margin: 0 0 4px; font-size: 20px; }
  .card p { margin: 0 0 12px; color: var(--muted); }
  a { color: var(--primary); font-weight: 600; text-decoration: none; margin-right: 18px; }
  a:hover { text-decoration: underline; }
  footer { margin-top: 32px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>NNRZONE</h1>
  <p class="lead">Apps for Android.</p>
  <div class="card">
    <h2>Nourio</h2>
    <p>Log meals by photo or barcode. Track calories, nutrients, burn and weight.</p>
    <a href="https://play.google.com/store/apps/details?id=com.nnrzone.nourio">Get it on Google Play</a>
    <a href="https://niranga93.github.io/FoodTracker/">Privacy policy</a>
  </div>
  <footer>Contact: <a href="mailto:foodtracker777@gmail.com">foodtracker777@gmail.com</a></footer>
</main>
</body>
</html>
